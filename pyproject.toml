[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "EasyRerank"
version = "0.2.3"
description = "A premium, self-contained Python module for local (llama.cpp) and remote (Jina AI, OpenRouter) semantic document reranking with automatic chunk splitting and vision/image reranking support."
readme = "README.md"
authors = [
    { name = "Jon Allen" }
]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: General",
]
keywords = ["rerank", "cross-encoder", "semantic-search", "llama.cpp", "jina", "openrouter", "nvidia", "vision-rerank", "multimodal", "nlp", "information-retrieval"]
requires-python = ">=3.8"
dependencies = [
    "requests>=2.25.0",
]

[project.urls]
Homepage = "https://github.com/jon2allen/EasyRerank"
Repository = "https://github.com/jon2allen/EasyRerank.git"
Issues = "https://github.com/jon2allen/EasyRerank/issues"

[tool.setuptools]
package-dir = { "" = "." }

[tool.setuptools.packages.find]
where = ["."]
include = ["EasyRerank*"]
exclude = ["Madison*", "tests*", "venv*"]

[project.optional-dependencies]
dev = [
    "build>=1.0.0",
    "twine>=4.0.0",
    "pytest>=7.0.0",
    "black>=23.0.0",
]
